<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chat interactif PEGINTI IA">
<meta name="robots" content="noindex">
<title>PEGINTI IA — Chat interactif</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch.png">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="entete" id="entete"><a class="logo" href="/">PEGINTI <span>IA</span></a></header>
<main>
<h1>Chat interactif</h1>
<p class="sous-titre">Vitrine publique et gratuite. Connectez-vous pour conserver votre historique et profiter de limites plus larges.</p>
<div class="carte">
  <div class="fil" id="fil" data-endpoint="/api/chat" data-vitrine="CHAT_INTERACTIF" aria-live="polite"></div>
  <div id="zone-msg"></div>
  <form id="form-chat">
    <label for="message">Votre message</label>
    <textarea id="message" maxlength="4000" rows="2" placeholder="Posez votre question…" required></textarea>
    <div class="rangee"><button type="submit">Envoyer</button><button type="button" class="discret" id="effacer">Effacer la conversation</button></div>
  </form>
</div>
</main>
<nav class="nav-bas" id="nav-bas" aria-label="Navigation mobile"></nav>
<script src="/assets/js/commun.js" defer></script>
<script src="/assets/js/chat.js" defer></script>
</body>
</html>
