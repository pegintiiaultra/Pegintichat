<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030a16" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <!-- Central Brain / Sovereign Matrix Nodes -->
  <g filter="url(#glow)" stroke="url(#brainGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M 52 36 C 40 36 34 46 34 56 C 34 68 42 74 46 84 C 48 88 52 90 56 90"/>
    <path d="M 40 50 C 46 54 48 60 46 68"/>
    <path d="M 52 46 C 48 54 52 64 54 74"/>
    <!-- Right Hemisphere -->
    <path d="M 68 36 C 80 36 86 46 86 56 C 86 68 78 74 74 84 C 72 88 68 90 64 90"/>
    <path d="M 80 50 C 74 54 72 60 74 68"/>
    <path d="M 68 46 C 72 54 68 64 66 74"/>
    <!-- Core Bridge -->
    <line x1="52" y1="46" x2="68" y2="46"/>
    <line x1="46" y1="62" x2="74" y2="62"/>
    <line x1="54" y1="78" x2="66" y2="78"/>
  </g>
  <!-- Crown Sovereign Star -->
  <polygon points="60,20 62.5,27 70,27 64,31.5 66,38 60,34 54,38 56,31.5 50,27 57.5,27" fill="#fcd116" filter="url(#glow)"/>
  <!-- Synaptic Nodes -->
  <circle cx="34" cy="56" r="2.5" fill="#38bdf8"/>
  <circle cx="86" cy="56" r="2.5" fill="#38bdf8"/>
  <circle cx="60" cy="90" r="3" fill="#10b981"/>
</svg>
