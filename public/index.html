<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PEGINTICHAT v3</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5dc;
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #001f3f;
      color: gold;
      padding: 10px;
      text-align: center;
      font-size: 1.5em;
    }
    #search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px;
    }
    #sujet {
      flex: 1;
      padding: 10px;
      border: 2px solid gold;
      border-radius: 4px;
      font-size: 1em;
      background: #111;
      color: #fff;
    }
    #wounanetBtn {
      margin-left: 10px;
      padding: 10px 20px;
      background: #00ff66;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    #pingBtn {
      margin-left: 10px;
      padding: 10px 20px;
      background: #0074D9;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    #output {
      margin: 20px;
      padding: 15px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      min-height: 200px;
      white-space: pre-wrap;
    }
    .article {
      margin: 5px 0;
      padding: 5px;
      border-bottom: 1px solid #333;
    }
    .article a {
      color: #00ff66;
      text-decoration: none;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>🧠 PEGINTICHAT v3 — Interface jumelée</header>
  <div id="search-bar">
    <input id="sujet" type="text" placeholder="Entrez un sujet...">
    <button id="wounanetBtn">Wounanet</button>
    <button id="pingBtn">Ping</button>
  </div>
  <div id="output">Résultats...</div>
  <script src="app.js"></script>
</body>
</html>
