<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PEGINTICHAT - Plateforme IA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Logo principal -->
  <header>
    <img src="assets/logo-peginti.jpg" alt="Logo PEGINTI">
    <h1>PEGINTICHAT — Plateforme IA</h1>
  </header>

  <!-- Vitrine publique -->
  <section class="public">
    <h2>PEGINTICHAT Public</h2>
    <input type="text" id="publicMessage" placeholder="Votre message...">
    <button onclick="fetchPublic()">Envoyer</button>
    <pre id="publicResult"></pre>
  </section>

  <!-- Fenêtre Wounanet -->
  <section class="wounanet">
    <h2>Wounanet Recherche</h2>
    <input type="text" id="wounanetMessage" placeholder="Sujet à rechercher...">
    <button id="wounanetBtn" onclick="fetchWounanet()">Envoyer</button>
    <pre id="wounanetResult"></pre>
  </section>

  <!-- Vitrine premium -->
  <section class="premium">
    <h2>PEGINTICHAT Premium</h2>
    <p>Découvrez les produits et services PEGINTI disponibles en ligne.</p>
    <button onclick="window.location.href='https://peginti-shop.online'">Accéder à la boutique</button>
  </section>

  <!-- Footer -->
  <footer>
    <p>© PEGINTI Framework — Bo’oivini Server</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
