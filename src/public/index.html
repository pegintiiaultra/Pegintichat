<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PEGINTI‑CHAT V3</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- En‑tête doctrinal -->
  <header class="topbar">
    <img src="logo.png" alt="Logo PEGINTI" class="logo">
    <h1>PEGINTI‑CHAT V3</h1>
    <nav class="vitrines">
      <a href="https://pegintichat.online" class="vitrine-public">Public</a>
      <a href="https://ultra.pegintichat.online" class="vitrine-premium">Premium</a>
    </nav>
  </header>

  <!-- Bouton Wounanet -->
  <button id="wounanet-btn" class="wounanet-btn">WOUNANET</button>

  <!-- Conteneur du chat -->
  <section class="chat-container">
    <h2>Dialogue doctrinal</h2>
    <div id="chat-messages" class="chat-text"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Écris ton message...">
      <button type="submit" class="send-btn">Envoyer</button>
    </form>
  </section>

  <!-- Pied de page -->
  <footer>
    <p>© PEGINTI Framework — Bo’oivini Server • Wounanet API</p>
  </footer>
</body>
</html>
